# CI Workflow for mcp-ms-access
#
# NOTE: COM/ODBC gates (G1, G3-G7, G9-G11, G13) are LOCAL-ONLY.
# GitHub runners do not have Microsoft Access installed and cannot execute
# these gates. They are documented here for completeness and local reference
# only. The full qualification matrix must be run on a local Windows machine
# with Microsoft Access present.
#
# This workflow covers:
#   G2  — Static analysis (ruff + pyright)
#   G12 — Tool budget
#   Unit tests (tests/unit/ only — no COM/ODBC integration markers)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check (G2)
        run: uv run ruff check .

      - name: Pyright type check (G2)
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest tests/unit/ -q

      - name: Tool budget (G12)
        run: uv run python scripts/tool_budget.py
