# CI Workflow for mcp-ms-access
#
# COM/ODBC gates (G1, G3-G7, G9-G11, G13) are LOCAL-ONLY for hosted
# runners: GitHub-hosted machines have no Microsoft Access. The
# `com-integration` job below runs ONLY on a self-hosted runner labeled
# `windows, access`, and it is gated on the repository variable
# `ACCESS_RUNNER_ENABLED`: with no such runner registered, GitHub would
# queue the job for 24 hours and then cancel it, leaving every push with
# a permanently open run. Register a Windows machine with Access + ACE,
# then set `ACCESS_RUNNER_ENABLED=true` (Settings -> Variables) to
# activate it.
# The full qualification matrix (including the g13 chaos harness)
# remains an operator-triggered local run.
#
# The hosted job covers:
#   G2  — Static analysis (ruff + pyright)
#   G12 — Tool budget
#   Unit tests (tests/unit/ only — no COM/ODBC integration markers)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check (G2)
        run: uv run ruff check .

      - name: Pyright type check (G2)
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest tests/unit/ -q

      - name: Tool budget (G12)
        run: uv run python scripts/tool_budget.py

  com-integration:
    name: COM integration (self-hosted Access)
    # Dormant until a runner exists (see the header): without this gate a job with no
    # matching runner waits 24 hours and is cancelled, which keeps the run open forever.
    if: vars.ACCESS_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, windows, access]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Access availability
        shell: pwsh
        run: |
          $msaccess = Get-ChildItem 'C:\Program Files\Microsoft Office\root\Office*\MSACCESS.EXE',
            'C:\Program Files (x86)\Microsoft Office\root\Office*\MSACCESS.EXE' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msaccess) { throw 'MSACCESS.EXE not found; this runner must have Access installed.' }
          Write-Host "Access binary: $($msaccess.FullName)"

      - name: Create isolated venv
        shell: pwsh
        run: |
          python -m venv .venv-ci
          .venv-ci\Scripts\python.exe -m pip install --upgrade pip
          .venv-ci\Scripts\python.exe -m pip install -e .[dev]

      - name: Unit sanity
        shell: pwsh
        run: .venv-ci\Scripts\python.exe -B -m pytest tests/unit -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: COM integration suite
        shell: pwsh
        run: .venv-ci\Scripts\python.exe -B -m pytest tests/integration -m "com_integration or odbc_integration" -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ACCESS_DOCUMENTATION_FIXTURES_TEST: '1'

      - name: Shutdown resilience smoke (g10)
        shell: pwsh
        # g10 spawns `uv run python -m ms_access_mcp.server` internally for
        # its stdin-close rounds, so the runner must have uv on PATH.
        run: .venv-ci\Scripts\python.exe -B scripts/g10_repeated_shutdown.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
