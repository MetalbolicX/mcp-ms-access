[project]
name = "ms-access-mcp"
version = "0.1.0"
description = "Local stdio MCP server and CLI for Microsoft Access (Windows x64)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2.0",
    "pydantic>=2.0.0",
    "pyodbc>=5.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "pyright>=1.1.300"]

[project.scripts]
ms-access-mcp = "ms_access_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_access_mcp"]

[tool.pytest.ini_options]
markers = [
    "com_integration: requires Windows + Access COM",
    "odbc_integration: requires Access ODBC driver",
    "slow: long-running",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # warnings
    "I",     # isort
    "N",     # pep8-naming
    "C4",    # comprehensions
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled separately)
    "N802",   # function name in class
    "N803",   # argument name
    "N806",   # variable in function
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D", "ARG002", "PLR", "BLE", "EM", "TRY003", "FBT"]
"src/ms_access_mcp/backends/**" = ["S101", "ANN", "D", "ARG002", "PLR", "BLE", "EM", "TRY003", "FBT", "SLF001"]
"src/ms_access_mcp/doctor.py" = ["S101", "ANN", "D", "ARG002", "PLR", "BLE", "EM", "TRY003", "FBT"]

